name: CISignal post-CI

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions: {}

jobs:
  analyze:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] }}
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: Dannyso05/CISignal/.github/workflows/reusable-analysis.yml@bce5ecd9d22c66c6bcb0cc4e2769b50f8d64ee3c
    with:
      run_id: ${{ github.event.workflow_run.id }}
      base_sha: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      pull_request: ${{ github.event.workflow_run.pull_requests[0].number }}
      cisignal_ref: bce5ecd9d22c66c6bcb0cc4e2769b50f8d64ee3c
