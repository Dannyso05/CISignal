name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run demo:generate -- --seed 20260823
      - run: npm run demo:verify
      - run: npm run dashboard:build
      - name: Confirm generated demo is reproducible
        run: git diff --exit-code -- demo fixtures dashboard/public/data/demo-dashboard.json
