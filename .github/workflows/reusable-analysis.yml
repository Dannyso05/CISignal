name: CISignal reusable analysis

on:
  workflow_call:
    inputs:
      run_id:
        description: Failed GitHub Actions run ID to analyze
        required: true
        type: string
      base_sha:
        description: Base commit used to calculate the related diff
        required: true
        type: string
      head_sha:
        description: Failed run head commit
        required: true
        type: string
      pull_request:
        description: Pull request number to update, or 0 for no comment
        required: false
        default: 0
        type: number
      comment_on_pr:
        description: Publish an idempotent CISignal pull request comment
        required: false
        default: true
        type: boolean
      token_budget:
        description: Maximum estimated tokens in the agent evidence packet
        required: false
        default: 2000
        type: number
      cisignal_ref:
        description: CISignal branch, tag, or commit to execute
        required: false
        default: main
        type: string

permissions: {}

jobs:
  analyze:
    name: Analyze failed CI run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the pinned CISignal engine
        uses: actions/checkout@v7
        with:
          repository: Dannyso05/CISignal
          ref: ${{ inputs.cisignal_ref }}
          path: .cisignal-engine
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install and build the deterministic analyzer
        run: |
          npm ci --prefix .cisignal-engine
          npm --prefix .cisignal-engine run build

      - name: Analyze failed jobs and the commit diff
        env:
          RUN_ID: ${{ inputs.run_id }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TOKEN_BUDGET: ${{ inputs.token_budget }}
        run: |
          node .cisignal-engine/dist/src/cli.js github analyze \
            --repository "${{ github.repository }}" \
            --run-id "$RUN_ID" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --token-budget "$TOKEN_BUDGET" \
            --output-dir "$RUNNER_TEMP/cisignal"

      - name: Publish the native CISignal check
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          existing_check_id=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" --jq '.check_runs[] | select(.name == "CISignal") | .id' | head -n 1)
          if [ -n "$existing_check_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/check-runs/$existing_check_id" \
              -f name="CISignal" \
              -f status="completed" \
              -f conclusion="neutral" \
              -f external_id="cisignal-$RUN_ID" \
              -f details_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -f 'output[title]=Failure intelligence ready' \
              -F "output[summary]=@$RUNNER_TEMP/cisignal/summary.md"
          else
            gh api --method POST "repos/${{ github.repository }}/check-runs" \
              -f name="CISignal" \
              -f head_sha="$HEAD_SHA" \
              -f status="completed" \
              -f conclusion="neutral" \
              -f external_id="cisignal-$RUN_ID" \
              -f details_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -f 'output[title]=Failure intelligence ready' \
              -F "output[summary]=@$RUNNER_TEMP/cisignal/summary.md"
          fi

      - name: Render the pull request report
        if: inputs.comment_on_pr && inputs.pull_request > 0
        run: |
          node .cisignal-engine/dist/src/cli.js render-pr-comment \
            --report "$RUNNER_TEMP/cisignal/report.json" \
            --output "$RUNNER_TEMP/cisignal/pr-comment.md"

      - name: Publish or update the CISignal comment
        if: inputs.comment_on_pr && inputs.pull_request > 0
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
        shell: bash
        run: |
          existing_comment_id=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- signalci-pr-report -->")) | .id' | tail -n 1)
          if [ -n "$existing_comment_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing_comment_id" -F body=@"$RUNNER_TEMP/cisignal/pr-comment.md"
          else
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/cisignal/pr-comment.md"
          fi

      - name: Write the CISignal job summary
        run: cat "$RUNNER_TEMP/cisignal/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded CISignal artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cisignal-${{ inputs.run_id }}
          path: ${{ runner.temp }}/cisignal
          if-no-files-found: error
          retention-days: 14
